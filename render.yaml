services:
  - type: web
    name: nutrify-app
    env: php
    plan: free
    buildCommand: composer install && npm install && npm run build && php artisan migrate --force
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        scope: build
        value: ${APP_KEY}
      - key: DATABASE_URL
        scope: build
        value: ${DATABASE_URL}
      - key: LOG_CHANNEL
        value: stderr
